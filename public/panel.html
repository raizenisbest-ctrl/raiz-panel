<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaizPro - Admin & Genel Key Kontrol Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #c5c6c7; min-height: 100vh; padding: 30px 20px; font-family: 'Inter', sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(102, 252, 241, 0.2); padding-bottom: 20px; }
        .logo h1 { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 2.2rem; font-weight: 900; text-shadow: 0 0 15px #66fcf1; }
        .card { background: rgba(10, 15, 20, 0.7); border: 1px solid rgba(102, 252, 241, 0.2); border-radius: 16px; padding: 25px; margin-bottom: 30px; backdrop-filter: blur(10px); }
        .card h2 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: #fff; margin-bottom: 20px; border-left: 4px solid #66fcf1; padding-left: 12px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        select, input { width: 100%; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.8); border: 1px solid rgba(102, 252, 241, 0.3); color: #fff; font-family: 'Inter', sans-serif; outline: none; }
        .btn { background: linear-gradient(45deg, #1f2833, #45a29e, #66fcf1); color: #050505; border: none; padding: 12px 24px; font-family: 'Orbitron', sans-serif; font-weight: 900; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(102, 252, 241, 0.5); color: #fff; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        th { color: #45a29e; font-family: 'Orbitron', sans-serif; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-genel { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .badge-hwid { background: rgba(255, 165, 2, 0.2); color: #ffa502; border: 1px solid #ffa502; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>RaizPro Panel</h1>
                <p style="color: #45a29e; font-size: 0.85rem;">HWID'siz Genel Key & Lisans Yönetimi</p>
            </div>
        </header>

        <!-- Key Sorgulama Kartı -->
        <div class="card">
            <h2><i class="fas fa-search"></i> HWID'siz Genel Key Kontrol Et</h2>
            <form id="check-form" class="form-row">
                <div style="grid-column: span 2;">
                    <input type="text" id="check-key-input" placeholder="Sorgulanacak Key Kodu (Örn: RAIZ-GENEL-98A2-31BF)" required style="font-family: monospace;">
                </div>
                <div>
                    <button type="submit" class="btn" style="width: 100%;"><i class="fas fa-check"></i> Sorgula</button>
                </div>
            </form>
            <div id="check-result" style="display: none; margin-top: 20px; padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.5);"></div>
        </div>

        <!-- Key Oluşturma Kartı -->
        <div class="card">
            <h2><i class="fas fa-plus-circle"></i> Yeni Key Oluştur</h2>
            <form id="create-form" class="form-row">
                <div>
                    <label style="display:block; margin-bottom: 5px; font-size: 0.8rem; color: #45a29e;">Key Tipi:</label>
                    <select id="key-type">
                        <option value="true" selected>HWID'siz Genel Key (Tüm Cihazlar)</option>
                        <option value="false">HWID Kilitli Key (Tek Cihaz)</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; margin-bottom: 5px; font-size: 0.8rem; color: #45a29e;">Süre:</label>
                    <select id="key-days">
                        <option value="1">1 Günlük Deneme Key</option>
                        <option value="7">7 Günlük Key</option>
                        <option value="30" selected>30 Günlük Key</option>
                        <option value="90">90 Günlük Key</option>
                        <option value="9999">Sınırsız (Lifetime) Key</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; margin-bottom: 5px; font-size: 0.8rem; color: #45a29e;">Not / Müşteri:</label>
                    <input type="text" id="key-note" placeholder="Örn: Müşteri #1042">
                </div>
                <div>
                    <button type="submit" class="btn" style="width: 100%;"><i class="fas fa-key"></i> Key Oluştur</button>
                </div>
            </form>
        </div>

        <!-- Key Listesi Kartı -->
        <div class="card">
            <h2><i class="fas fa-list"></i> Veritabanındaki Key Listesi</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Key Kodu</th>
                            <th>Tür</th>
                            <th>Süre</th>
                            <th>Son Kullanma</th>
                            <th>Not</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="keys-tbody">
                        <!-- Key satırları buraya gelecek -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkForm = document.getElementById('check-form');
            const checkInput = document.getElementById('check-key-input');
            const checkResult = document.getElementById('check-result');

            const createForm = document.getElementById('create-form');
            const keysTbody = document.getElementById('keys-tbody');

            // Key Kontrol etme
            checkForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const keyStr = checkInput.value.trim();
                try {
                    const res = await fetch('/api/check-key', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: keyStr })
                    });
                    const data = await res.json();
                    
                    checkResult.style.display = 'block';
                    if (data.success) {
                        checkResult.style.border = '1px solid #2ed573';
                        checkResult.innerHTML = `
                            <h4 style="color: #2ed573; margin-bottom: 5px;"><i class="fas fa-check-circle"></i> ${data.message}</h4>
                            <p style="font-size: 0.9rem; color: #ccc;">Kalan Süre: <strong style="color: #66fcf1;">${data.remainingDays}</strong> | Son Kullanma: ${new Date(data.expires_at).toLocaleDateString('tr-TR')}</p>
                        `;
                    } else {
                        checkResult.style.border = '1px solid #ff4757';
                        checkResult.innerHTML = `<h4 style="color: #ff4757;"><i class="fas fa-times-circle"></i> ${data.message}</h4>`;
                    }
                } catch (err) {
                    alert("Kontrol yapılırken hata oluştu.");
                }
            });

            // Key Oluşturma
            createForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const is_genel = document.getElementById('key-type').value === 'true';
                const duration_days = document.getElementById('key-days').value;
                const note = document.getElementById('key-note').value;

                try {
                    const res = await fetch('/api/create-key', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ is_genel, duration_days, note })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Yeni Key Oluşturuldu: ${data.key.key}`);
                        createForm.reset();
                        loadKeys();
                    } else {
                        alert("Key oluşturulamadı.");
                    }
                } catch (err) {
                    alert("Sunucu hatası!");
                }
            });

            // Key Listesini Yükleme
            const loadKeys = async () => {
                try {
                    const res = await fetch('/api/keys');
                    const keys = await res.json();
                    
                    keysTbody.innerHTML = '';
                    if (!keys || keys.length === 0) {
                        keysTbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888;">Henüz key oluşturulmadı.</td></tr>`;
                        return;
                    }

                    keys.forEach(k => {
                        const tr = document.createElement('tr');
                        const isGenelBadge = k.is_genel ? '<span class="badge badge-genel"><i class="fas fa-unlock"></i> HWID\'siz Genel</span>' : '<span class="badge badge-hwid"><i class="fas fa-lock"></i> HWID Kilitli</span>';
                        
                        tr.innerHTML = `
                            <td style="font-family: monospace; color: #66fcf1; font-weight: bold;">${k.key}</td>
                            <td>${isGenelBadge}</td>
                            <td>${k.duration_days >= 999 ? 'Sınırsız' : k.duration_days + ' Gün'}</td>
                            <td>${new Date(k.expires_at).toLocaleDateString('tr-TR')}</td>
                            <td>${k.note || '-'}</td>
                            <td>
                                <button onclick="deleteKey('${k._id}')" style="background: rgba(255, 71, 87, 0.2); border: 1px solid #ff4757; color: #ff4757; padding: 4px 10px; border-radius: 6px; cursor: pointer;">Sil</button>
                            </td>
                        `;
                        keysTbody.appendChild(tr);
                    });
                } catch (err) {
                    console.error("Listeleme hatası:", err);
                }
            };

            window.deleteKey = async (id) => {
                if (confirm("Bu key'i silmek istediğinize emin misiniz?")) {
                    await fetch(`/api/keys/${id}`, { method: 'DELETE' });
                    loadKeys();
                }
            };

            loadKeys();
        });
    </script>
</body>
</html>
